<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>VYBE — Image to Motion (depth)</title>
    <!--
      Depth-map parallax (2.5D) with Three.js: a full-frame shader offsets each
      pixel's lookup by its depth as a virtual camera moves, so near things move
      more than far things. Inputs: the source image and a depth map (white =
      near). Same pixels, new viewpoint — not generated motion.
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #i2m-root { position: relative; width: 100%; height: 100%; overflow: hidden; container-type: size; background: #000; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.5) 100%); }
      #captions { position: absolute; left: 8cqw; right: 8cqw; bottom: 8cqh; z-index: 22; display: flex; justify-content: center; pointer-events: none; }
      .cap { position: absolute; bottom: 0; text-align: center; font: 600 3.1cqmin/1.25 sans-serif; color: #fff; opacity: 0; text-shadow: 0 0.3cqmin 1.4cqmin rgba(0,0,0,0.85); }
    </style>
  </head>
  <body>
    <div id="i2m-root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <canvas id="gl" width="1920" height="1080" data-layout-allow-overflow></canvas>
      <div id="vignette"></div>
      <div id="captions" aria-hidden="true"></div>
      <!-- vybe:captions:start --><!-- vybe:captions:end -->
      <!-- vybe:audio:start --><!-- vybe:audio:end -->
    </div>
    <script type="application/json" id="i2m-config">{"camera":"push","intensity":1,"effects":[],"duration":8,"image":"assets/images/source.png","depth":"assets/images/depth.png","imageAspect":1.7778}</script>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.181.2/+esm";
      const cfg = JSON.parse(document.getElementById("i2m-config").textContent);
      const root = document.getElementById("i2m-root");
      const W = Number(root.dataset.width), H = Number(root.dataset.height), D = cfg.duration;
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: false });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      // Textures go through DefaultLoadingManager, which HyperFrames awaits before seeking.
      const loader = new THREE.TextureLoader();
      const img = loader.load(cfg.image);
      const depth = loader.load(cfg.depth);
      img.colorSpace = THREE.SRGBColorSpace;
      // object-fit: cover, with 10% overscan so offsets never reveal the edge.
      const frameAspect = W / H;
      const cover = cfg.imageAspect > frameAspect ? new THREE.Vector2(frameAspect / cfg.imageAspect, 1) : new THREE.Vector2(1, cfg.imageAspect / frameAspect);
      const material = new THREE.ShaderMaterial({
        uniforms: { uImg: { value: img }, uDepth: { value: depth }, uCam: { value: new THREE.Vector3() }, uCover: { value: cover.multiplyScalar(0.9) } },
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
        fragmentShader: `
          uniform sampler2D uImg; uniform sampler2D uDepth; uniform vec3 uCam; uniform vec2 uCover; varying vec2 vUv;
          void main(){
            vec2 uv = (vUv - 0.5) * uCover / (1.0 + uCam.z) + 0.5;
            float d = texture2D(uDepth, uv).r;
            // Two refinement steps reduce smearing at depth edges.
            vec2 off = uCam.xy * (d - 0.35);
            d = texture2D(uDepth, uv + off).r;
            off = uCam.xy * (d - 0.35);
            gl_FragColor = texture2D(uImg, uv + off);
            #include <colorspace_fragment>
          }`,
      });
      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

      const k = cfg.intensity;
      const s = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
      const paths = {
        push: (p) => [0.004 * Math.sin(p * Math.PI) * k, 0, 0.09 * s(p) * k],
        pull: (p) => [0, 0, 0.09 * (1 - s(p)) * k],
        "pan-right": (p) => [(-0.035 + 0.07 * s(p)) * k, 0, 0.02],
        "pan-left": (p) => [(0.035 - 0.07 * s(p)) * k, 0, 0.02],
        rise: (p) => [0, (-0.03 + 0.06 * s(p)) * k, 0.03],
        orbit: (p) => [0.04 * Math.sin(p * Math.PI * 2 - Math.PI / 2) * k, 0.012 * Math.cos(p * Math.PI * 2) * k, 0.04 * k],
      };
      const path = paths[cfg.camera] || paths.push;
      function renderAt(t) {
        const [x, y, z] = path(Math.min(1, t / D));
        material.uniforms.uCam.value.set(x, y, z);
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#vignette", { opacity: 0.6 }, { opacity: 1, duration: 2, ease: "sine.inOut" }, 0);
      const capData = document.getElementById("vybe-captions");
      if (capData) {
        const capHost = document.getElementById("captions");
        JSON.parse(capData.textContent).forEach((cue, i) => {
          const el = document.createElement("div");
          el.className = "cap";
          el.id = `cap-${i}`;
          el.textContent = cue.text;
          capHost.appendChild(el);
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.15 }, cue.start);
          tl.to(el, { opacity: 0, duration: 0.15 }, cue.end + 0.05);
        });
      }
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
