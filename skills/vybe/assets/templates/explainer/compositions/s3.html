<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s3-root { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 7cqw; }
        #s3-steps { display: flex; gap: 3cqmin; width: 100%; }
        .s3-card { flex: 1; padding: 3.4cqmin; border-radius: 2.4cqmin; background: rgba(11,20,36,0.85); border: 0.2cqmin solid rgba(127,147,173,0.25); }
        .s3-n { display: block; font-family: var(--vy-font-mono), monospace; font-size: 3cqmin; color: var(--vy-accent); }
        .s3-card h3 { font-family: var(--vy-font-display), sans-serif; font-weight: 600; font-size: 4.6cqmin; margin-top: 1.6cqmin; letter-spacing: -0.02em; }
        .s3-card p { font-size: 2.8cqmin; color: var(--vy-muted); margin-top: 1cqmin; line-height: 1.3; }
        .s3-bar { display: block; height: 0.5cqmin; width: 100%; margin-top: 2.6cqmin; background: var(--vy-accent-2); transform-origin: left center; }
        @container (max-aspect-ratio: 1/1) { #s3-steps { flex-direction: column; } }
      </style>
      <div id="s3-root" data-composition-id="s3" data-width="1920" data-height="1080">
        <div id="s3-steps">
          <div class="s3-card"><span class="s3-n">01</span><h3>Input</h3><p>What goes in.</p><span class="s3-bar"></span></div>
          <div class="s3-card"><span class="s3-n">02</span><h3>Process</h3><p>What happens to it.</p><span class="s3-bar"></span></div>
          <div class="s3-card"><span class="s3-n">03</span><h3>Result</h3><p>What comes out.</p><span class="s3-bar"></span></div>
        </div>
      </div>
      <script>
        // Process: cards assemble one per beat; a bar fills on each as the "current" step.
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s3-root .s3-card", { opacity: 0, y: 60, rotationX: -25, transformPerspective: 900 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.8, ease: "expo.out", stagger: 0.9 }, 0.2);
        tl.fromTo("#s3-root .s3-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut", stagger: 0.9 }, 0.7);
        tl.to("#s3-steps", { opacity: 0, scale: 0.96, duration: 0.45, ease: "power2.in" }, 4.05);
        window.__timelines["s3"] = tl;
      </script>
    </template>
  </body>
</html>
