<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #sting-root { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        #sting-lockup { display: flex; flex-direction: column; align-items: center; gap: 3.4cqmin; }
        #sting-mark { width: 30cqmin; height: 30cqmin; overflow: visible; }
        #sting-mark polygon { stroke: rgba(255,255,255,0.35); stroke-width: 1; }
        #sting-ring { position: absolute; left: 50%; top: 50%; width: 30cqmin; height: 30cqmin; margin: -15cqmin 0 0 -15cqmin; border-radius: 50%; border: 0.5cqmin solid var(--vy-accent-2); opacity: 0; }
        #sting-word { display: flex; font-family: var(--vy-font-display), sans-serif; font-weight: var(--vy-display-weight); font-size: 9cqmin; letter-spacing: var(--vy-tracking-display); line-height: 1; }
        #sting-word .ch { display: inline-block; }
        #sting-tag { font-size: 2.8cqmin; color: var(--vy-muted); letter-spacing: 0.3em; text-transform: uppercase; }
      </style>
      <div id="sting-root" data-composition-id="sting" data-width="1920" data-height="1080">
        <div id="sting-ring" data-layout-allow-overflow></div>
        <div id="sting-lockup">
          <!-- Placeholder mark: six triangles forming a hexagon. Swap for the real logo SVG. -->
          <svg id="sting-mark" viewBox="-100 -100 200 200" aria-label="Logo mark">
            <defs>
              <linearGradient id="sting-g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: var(--vy-accent)" /><stop offset="1" style="stop-color: var(--vy-accent-2)" /></linearGradient>
            </defs>
            <polygon class="shard" points="0,0 0,-90 78,-45" fill="url(#sting-g1)" />
            <polygon class="shard" points="0,0 78,-45 78,45" fill="url(#sting-g1)" opacity="0.85" />
            <polygon class="shard" points="0,0 78,45 0,90" fill="url(#sting-g1)" opacity="0.7" />
            <polygon class="shard" points="0,0 0,90 -78,45" fill="url(#sting-g1)" opacity="0.85" />
            <polygon class="shard" points="0,0 -78,45 -78,-45" fill="url(#sting-g1)" opacity="0.7" />
            <polygon class="shard" points="0,0 -78,-45 0,-90" fill="url(#sting-g1)" />
          </svg>
          <div id="sting-word"><span class="ch">N</span><span class="ch">O</span><span class="ch">V</span><span class="ch">A</span></div>
          <div id="sting-tag">Your tagline here</div>
        </div>
      </div>
      <script>
        // Deterministic scatter for the shards (seeded, never Math.random).
        function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
        const rand = mulberry32(42);
        const tl = gsap.timeline({ paused: true });
        const shards = gsap.utils.toArray("#sting-mark .shard");
        // Frame 0 already shows the shards drifting (a usable thumbnail), converging by 1.7s.
        shards.forEach((s, i) => {
          const ang = (i / shards.length) * Math.PI * 2 + rand() * 0.6;
          const dist = 260 + rand() * 180;
          tl.fromTo(s, { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist, rotation: (rand() - 0.5) * 240, scale: 0.6, transformOrigin: "0px 0px" },
            { x: 0, y: 0, rotation: 0, scale: 1, duration: 1.5, ease: "expo.inOut" }, 0.2 + i * 0.03);
        });
        tl.fromTo("#sting-mark", { rotation: -30 }, { rotation: 0, duration: 1.9, ease: "power3.out" }, 0);
        tl.fromTo("#sting-mark", { scale: 1 }, { scale: 1.12, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 1.72);
        // Shockwave: invisible until the shards lock, then fires once.
        tl.fromTo("#sting-ring", { opacity: 0, scale: 0.9 }, { opacity: 0.9, duration: 0.02 }, 1.73);
        tl.to("#sting-ring", { opacity: 0, scale: 3.4, duration: 1.1, ease: "expo.out" }, 1.75);
        // Wordmark: letters spread from the centre into place (per-glyph x, not letter-spacing).
        const chars = gsap.utils.toArray("#sting-word .ch");
        chars.forEach((c, i) => {
          const off = (i - (chars.length - 1) / 2) * -38;
          tl.fromTo(c, { x: off, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 1.1, ease: "expo.out" }, 2.25 + Math.abs(i - (chars.length - 1) / 2) * 0.06);
        });
        tl.fromTo("#sting-tag", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 3.1);
        tl.fromTo("#sting-lockup", { scale: 1 }, { scale: 1.03, duration: 3.5, ease: "sine.inOut" }, 3.4);
        window.__timelines["sting"] = tl;
      </script>
    </template>
  </body>
</html>
