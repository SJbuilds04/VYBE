<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>VYBE — Social Reel</title>
    <!--
      VYBE template: social-reel (host), vertical-first.
      Beats: hook (on screen at frame 0) → 3 rapid punch cards → proof stat → CTA.
      Safe zone: keep reading content out of the top 12% and bottom 22% (platform UI),
      and the right 14% (action buttons). The #safe guide box below is invisible.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/SpaceGrotesk-Variable.woff2") format("woff2"); font-weight: 300 700; }
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.woff2") format("woff2"); font-weight: 400; }
      /* vybe:tokens:start */
      :root {
        --vy-bg: #0a0a0a; --vy-bg-2: #161616; --vy-ink: #f0f0f0; --vy-muted: #9a9a9a;
        --vy-accent: #c6ff00; --vy-accent-2: #7c3aed; --vy-glow: rgba(198,255,0,0.35);
        --vy-font-display: "Anton"; --vy-font-body: "Space Grotesk"; --vy-font-mono: "Space Grotesk";
        --vy-display-weight: 400; --vy-tracking-display: -0.01em;
      }
      /* vybe:tokens:end */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--vy-bg); }
      #vybe-root { position: relative; width: 100%; height: 100%; overflow: hidden; container-type: size; background: var(--vy-bg); color: var(--vy-ink); font-family: var(--vy-font-body), sans-serif; }
      .slot { position: absolute; inset: 0; }
      #progress { position: absolute; left: 4cqw; right: 4cqw; top: 3.5cqh; height: 0.9cqmin; border-radius: 1cqmin; background: rgba(255,255,255,0.18); overflow: hidden; z-index: 10; }
      #progress-fill { width: 100%; height: 100%; background: var(--vy-accent); transform-origin: left center; }
      #captions { position: absolute; left: 6cqw; right: 16cqw; bottom: 24cqh; z-index: 22; display: flex; justify-content: center; pointer-events: none; }
      .cap { position: absolute; bottom: 0; max-width: 100%; text-align: center; font-weight: 700; font-size: 5.2cqmin; line-height: 1.15; opacity: 0; text-transform: uppercase; }
      .cap .cw { display: inline-block; margin: 0 0.12em; opacity: 0.5; }
    </style>
  </head>
  <body>
    <div id="vybe-root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
      <div id="s1" class="slot" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="2.2" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s2" class="slot" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="2.2" data-duration="3.3" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s3" class="slot" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="5.5" data-duration="3.5" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s4" class="slot" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="9" data-duration="3" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="progress"><div id="progress-fill"></div></div>
      <div id="captions" aria-hidden="true"></div>
      <!-- vybe:captions:start --><!-- vybe:captions:end -->
      <!-- vybe:audio:start --><!-- vybe:audio:end -->
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#progress-fill", { scaleX: 0 }, { scaleX: 1, duration: 12, ease: "none" }, 0);
      const capData = document.getElementById("vybe-captions");
      if (capData) {
        const host = document.getElementById("captions");
        JSON.parse(capData.textContent).forEach((cue, i) => {
          const el = document.createElement("div");
          el.className = "cap";
          el.id = `cap-${i}`;
          const words = cue.words && cue.words.length ? cue.words : [{ text: cue.text, start: cue.start }];
          el.innerHTML = words.map((w, j) => `<span class="cw" id="cap-${i}-${j}">${w.text.replace(/</g, "&lt;")}</span>`).join(" ");
          host.appendChild(el);
          tl.fromTo(el, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.15, ease: "back.out(2)" }, cue.start);
          words.forEach((w, j) => tl.to(`#cap-${i}-${j}`, { opacity: 1, duration: 0.06 }, w.start));
          tl.to(el, { opacity: 0, duration: 0.1 }, cue.end + 0.05);
        });
      }
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
