<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s4-root { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 0 14cqw 0 6cqw; gap: 4cqmin; background: var(--vy-accent); color: var(--vy-bg); }
        #s4-line { font-family: var(--vy-font-display), sans-serif; font-size: 16cqmin; line-height: 0.95; text-transform: uppercase; }
        #s4-btn { display: flex; align-items: center; gap: 2cqmin; padding: 2.4cqmin 4.4cqmin; border-radius: 99cqmin; background: var(--vy-bg); color: var(--vy-accent); font-weight: 700; font-size: 5.4cqmin; }
        #s4-arrow { display: inline-block; }
      </style>
      <div id="s4-root" data-composition-id="s4" data-width="1080" data-height="1920">
        <h2 id="s4-line">Save this for later.</h2>
        <div id="s4-btn">Follow for more <span id="s4-arrow">→</span></div>
      </div>
      <script>
        // CTA: slams in, button pops, arrow nudges twice (finite repeat, never past the slot).
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s4-root", { yPercent: 100 }, { yPercent: 0, duration: 0.35, ease: "power3.out" }, 0);
        tl.fromTo("#s4-line", { scale: 1.15, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 0.15);
        tl.fromTo("#s4-btn", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.6)" }, 0.45);
        tl.fromTo("#s4-arrow", { x: 0 }, { x: 18, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.0);
        window.__timelines["s4"] = tl;
      </script>
    </template>
  </body>
</html>
