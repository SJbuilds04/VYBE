<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s3-root { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 9cqw; }
        #s3-block { text-align: right; }
        #s3-num { font-family: var(--vy-font-display), sans-serif; font-weight: 750; font-size: 20cqmin; letter-spacing: -0.06em; line-height: 0.9; color: var(--vy-accent); font-variant-numeric: tabular-nums; }
        #s3-label { font-size: 4.2cqmin; font-weight: 600; letter-spacing: -0.02em; margin-top: 1.2cqmin; }
        @container (max-aspect-ratio: 1/1) {
          #s3-root { align-items: flex-end; justify-content: center; padding: 0 0 12cqh; }
          #s3-block { text-align: center; }
        }
      </style>
      <div id="s3-root" data-composition-id="s3" data-width="1920" data-height="1080">
        <div id="s3-block">
          <div id="s3-num">0</div>
          <div id="s3-label">hours of battery life</div>
        </div>
      </div>
      <script>
        // Proof beat: a hard number counts up, then settles with a tiny overshoot.
        const tl = gsap.timeline({ paused: true });
        const counter = { v: 0 };
        const num = document.getElementById("s3-num");
        tl.fromTo("#s3-block", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
        tl.fromTo(counter, { v: 0 }, { v: 29, duration: 1.3, ease: "expo.out", onUpdate: () => { num.textContent = Math.round(counter.v); } }, 0.3);
        tl.fromTo("#s3-num", { scale: 0.92 }, { scale: 1, duration: 0.9, ease: "back.out(2.2)" }, 1.2);
        tl.to("#s3-block", { opacity: 0, y: -24, duration: 0.4, ease: "power2.in" }, 2.35);
        window.__timelines["s3"] = tl;
      </script>
    </template>
  </body>
</html>
